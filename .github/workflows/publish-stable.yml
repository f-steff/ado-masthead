name: Publish stable

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "tests/**"
      - "ci/**"
      - ".github/**"
      - "README.md"
      - "AGENTS.md"
      - ".gitignore"
      - ".gitattributes"

permissions:
  contents: write
  statuses: write
  id-token: write

jobs:
  publish:
    if: vars.MARKETPLACE_PUBLISH_ENABLED == 'true' && github.ref == 'refs/heads/main'
    uses: ./.github/workflows/marketplace.yml
    with:
      edition: stable
